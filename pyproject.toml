[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata
# ---------------------------------------------------------------------------

[project]
name = "sport5-fantasy"
version = "0.1.0"
description = "Unofficial asynchronous Python client and REST API for Sport5 Fantasy competitions (Israeli Premier League, Champions League, Euroleague, World Cup, Euro)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "sport5-fantasy contributors" },
]
keywords = [
    "fantasy",
    "sport5",
    "ligat-haal",
    "api",
    "reverse-engineering",
    "champions-league",
    "euroleague",
    "world-cup",
    "fastapi",
    "async",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# ---------------------------------------------------------------------------
# Runtime dependencies
# ---------------------------------------------------------------------------

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
]

# ---------------------------------------------------------------------------
# Optional / dev dependency groups
# ---------------------------------------------------------------------------

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "build>=1.0.0",
    "mypy>=1.10.0",
    "types-requests>=2.32.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
]

# ---------------------------------------------------------------------------
# CLI entry points
# ---------------------------------------------------------------------------

[project.scripts]
sport5-api = "sport5_fantasy_api.cli:main"
sport5-fantasy = "sport5_fantasy_api.cli:main"

# ---------------------------------------------------------------------------
# Setuptools package discovery & package data
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
where = ["."]
include = ["sport5_fantasy_api*"]
namespaces = false

[tool.setuptools.package-data]
sport5_fantasy_api = ["py.typed"]

# ---------------------------------------------------------------------------
# Ruff (linter + formatter)
# ---------------------------------------------------------------------------

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["sport5_fantasy_api"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "ANN401",  # `Any` type allowed in connectors
    "B008",    # FastAPI Depends() calls in function defaults
]

[tool.ruff.lint.isort]
known-first-party = ["sport5_fantasy_api"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# Mypy (static type checking)
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=sport5_fantasy_api --cov-report=term-missing --cov-report=html"
log_cli = true
log_cli_level = "INFO"

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["sport5_fantasy_api"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "def __repr__",
    "@abstractmethod",
]
