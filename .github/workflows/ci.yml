name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Upgrade pip and install package with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff linter and code formatting checks
        run: |
          ruff check sport5_fantasy_api tests scripts

      - name: Run static type checking (mypy)
        run: |
          mypy sport5_fantasy_api

      - name: Run test suite with coverage enforcement (>= 80%)
        run: |
          pytest --cov=sport5_fantasy_api --cov-report=term-missing --cov-fail-under=80

      - name: Verify package distribution build (sdist & wheel)
        run: |
          python -m build --sdist --wheel
