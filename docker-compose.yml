services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sport5-fantasy-api:latest
    container_name: sport5-fantasy-api
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
